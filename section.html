<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <style>
      :root { --ink:#172b4d; --muted:#5e6c84; --line:#ebecf0; --soft:#f7f8f9; --warm:#fff4e5; --needed:#a14b00; --link:#0c66e4; }
      * { box-sizing: border-box; }
      body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink); background:transparent; }
      #content { padding:2px 2px 10px; }
      h3 { font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:14px 0 8px; }
      h3:first-child { margin-top:0; }
      .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
      .box { background:#f4f3f1; border-radius:8px; padding:10px 12px; min-width:0; }
      .box.full { grid-column:1 / -1; }
      .box .bl { font-size:13px; color:var(--muted); margin-bottom:3px; }
      .box .bv { font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace; font-size:16px; font-weight:600; overflow-wrap:anywhere; }
      .box .bv .need, .box .bv .empty, .box .bv a { font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
      .box .bv .empty { font-weight:400; }
      .strip { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:6px; }
      .k { background:var(--soft); border-radius:8px; padding:9px 10px; min-width:0; }
      .k.warm { background:var(--warm); }
      .k .l { font-size:11px; font-weight:700; text-transform:uppercase; color:var(--muted); letter-spacing:.03em; }
      .k .v { font-size:15px; font-weight:700; margin-top:3px; overflow-wrap:anywhere; }
      .k.warm .v { color:var(--needed); }
      .sec { border-top:1px solid var(--line); margin-top:12px; padding-top:10px; }
      .sh { font-size:13px; font-weight:700; margin-bottom:6px; }
      .row { display:grid; grid-template-columns:150px 1fr; padding:4px 0; font-size:14px; }
      .row .l { color:var(--muted); }
      .row .v { overflow-wrap:anywhere; }
      .need { color:var(--needed); font-weight:600; }
      .empty { color:var(--muted); }
      a { color:var(--link); font-weight:600; text-decoration:none; }
      .note { background:#fff8e1; border-left:3px solid #f5cd47; padding:8px 10px; font-size:13px; border-radius:4px; margin-top:8px; white-space:pre-wrap; }
      .bar { display:flex; justify-content:flex-end; gap:8px; margin-top:12px; }
      button { font:inherit; font-size:14px; font-weight:600; border:0; border-radius:4px; padding:6px 12px; cursor:pointer; background:#e9ebee; color:var(--ink); }
      button.primary { background:#0c66e4; color:#fff; }
      input, select, textarea { font:inherit; font-size:14px; width:100%; padding:5px 8px; border:1px solid #c1c7d0; border-radius:4px; background:#fff; color:var(--ink); }
      textarea { min-height:60px; resize:vertical; }
      .row.edit { align-items:center; }
      @media (max-width:420px) { .strip { grid-template-columns:1fr 1fr; } .row { grid-template-columns:1fr; } }
      </style>
  </head>
  <body>
    <div id="content">Loading…</div>div>
    <script>
      var t = TrelloPowerUp.iframe();

      // Every field the Job Card holds. type: text | date | list
      var FIELDS = {
        client:     { label: 'Client', type: 'list', options: ['Mynd', 'Ark'], cf: 'Client' },
        fm:         { label: 'Field manager', type: 'list', options: ['Ashley', 'Tyler'], cf: 'Field Manager' },
        sub:        { label: 'Subcontractor', type: 'list', options: ['Alyssa', 'Pablo', 'Karen'], cf: 'Subcontractor' },
        scopeDate:  { label: 'Scheduled scope', type: 'date', cf: 'Scope Schedule' },
        ecd:        { label: 'ECD', type: 'date' },
        lockbox:    { label: 'Mechanical lockbox', type: 'text', cf: 'Mechanical Lockbox' },
        igloo:      { label: 'Igloo code', type: 'text', cf: 'Igloo Code' },
        accessPdf:  { label: 'Access PDF', type: 'text', cf: 'Access PDF' },
        navLink:    { label: 'NavAI link', type: 'text', cf: 'NavAI Link' },
        navCode:    { label: 'NavAI code', type: 'text', cf: 'NavAI Access Code' },
        scope:      { label: 'Scope', type: 'text', cf: 'Scope' },
        flooring:   { label: 'Flooring', type: 'text', cf: 'Flooring' },
        notes:      { label: 'Notes', type: 'notes' }
      };
      var SECTIONS = [
        { title: 'Property entry', keys: ['lockbox', 'igloo', 'accessPdf'] },
        { title: 'Inspection', keys: ['navLink', 'navCode'] },
        { title: 'Scope & flooring', keys: ['scope', 'flooring'] },
        { title: 'Job', keys: ['client', 'fm', 'sub', 'scopeDate', 'ecd'] }
        ];

      var job = {}, editing = false;

      function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      function md(d) { var x = new Date(d); return isNaN(x) ? '' : ('0' + (x.getUTCMonth() + 1)).slice(-2) + '/' + ('0' + x.getUTCDate()).slice(-2); }
      function iso(d) { return new Date(d).toISOString().slice(0, 10); }

      function shown(key) {
        var f = FIELDS[key], v = job[key];
        if (v === undefined || v === null || v === '') return '<span class="empty">Not provided</span>';
        if (/^needed$/i.test(String(v))) return '<span class="need">Needed</span>';
        if (f.type === 'date') return md(v);
        if (/^https?:\/\//i.test(String(v))) {
          var name = key === 'navLink' ? 'Open NavAI' : key === 'scope' ? 'Open scope' : 'Open';
          return '<a href="' + esc(v) + '" target="_blank" rel="noopener">' + name + ' ↗</a>';
        }
        return esc(v);
      }

      function kpi(label, value, warm) {
        return '<div class="k' + (warm ? ' warm' : '') + '"><div class="l">' + label + '</div><div class="v">' + value + '</div></div>';
      }

      var VIEW = [
        { title: 'Job', keys: ['client', 'fm', 'sub', 'scopeDate', 'scopeDue', 'ecd', 'accessPdf', 'scope'] },
        { title: 'Inspection', keys: ['navLink', 'navCode'] },
        { title: 'Property entry', keys: ['lockbox', 'igloo'] },
        { title: 'Flooring', keys: ['flooring'] }
        ];
      var FULL = { accessPdf: 1, scope: 1, navLink: 1, navCode: 1, flooring: 1 };

      function viewHtml() {
        var html = '';
        VIEW.forEach(function (s) {
          html += '<h3>' + s.title + '</h3><div class="grid">';
          s.keys.forEach(function (k) {
            var label, val;
            if (k === 'scopeDue') {
              label = 'Scope due (48 hours)';
              val = job.scopeDate ? md(new Date(job.scopeDate).getTime() + 48 * 3600 * 1000) : '<span class="need">Needed</span>';
            } else {
              label = FIELDS[k].label;
              val = (k === 'scopeDate' && !job.scopeDate) ? '<span class="need">Needed</span>' : shown(k);
            }
            html += '<div class="box' + (FULL[k] ? ' full' : '') + '"><div class="bl">' + label + '</div><div class="bv">' + val + '</div></div>';
          });
          html += '</div>';
        });
        if (job.notes) html += '<h3>Notes</h3><div class="note">' + esc(job.notes) + '</div>';
        html += '<div class="bar"><button class="primary" id="edit">Edit job card</button></div>';
        return html;
      }

      function input(key) {
        var f = FIELDS[key], v = job[key] || '';
        if (f.type === 'list') {
          return '<select data-k="' + key + '"><option value=""></option>' + f.options.map(function (o) {
            return '<option' + (o === v ? ' selected' : '') + '>' + o + '</option>';
          }).join('') + '</select>';
        }
        if (f.type === 'date') return '<input type="date" data-k="' + key + '" value="' + (v ? iso(v) : '') + '">';
        if (f.type === 'notes') return '<textarea data-k="' + key + '">' + esc(v) + '</textarea>';
        return '<input type="text" data-k="' + key + '" value="' + esc(v) + '">';
      }

      function editHtml() {
        var html = '';
        SECTIONS.slice().reverse().forEach(function (s) {
          html += '<div class="sec"><div class="sh">' + s.title + '</div>';
          s.keys.forEach(function (k) {
            html += '<div class="row edit"><span class="l">' + FIELDS[k].label + '</span>' + input(k) + '</div>';
          });
          html += '</div>';
        });
        html += '<div class="sec"><div class="row edit"><span class="l">Notes</span>' + input('notes') + '</div></div>';
        html += '<div class="bar"><button id="cancel">Cancel</button><button class="primary" id="save">Save</button></div>';
        return html;
      }

      function draw() {
        var el = document.getElementById('content');
        el.innerHTML = editing ? editHtml() : viewHtml();
        if (editing) {
          document.getElementById('cancel').onclick = function () { editing = false; draw(); };
          document.getElementById('save').onclick = save;
        } else {
          document.getElementById('edit').onclick = function () { editing = true; draw(); };
        }
        return t.sizeTo('#content');
      }

      function save() {
        var next = {};
        Array.prototype.forEach.call(document.querySelectorAll('[data-k]'), function (el) {
          var k = el.getAttribute('data-k'), v = el.value.trim();
          if (!v) return;
          // Dates are kept as noon UTC so they never shift a day in any time zone.
          next[k] = FIELDS[k].type === 'date' ? v + 'T12:00:00.000Z' : v;
        });
        return t.set('card', 'shared', 'job', next).then(function () { job = next; editing = false; return draw(); });
      }

      // One-time copy from the old Trello custom fields, so nothing is lost when they are deleted.
      function fromCustomFields() {
        return Promise.all([t.board('customFields'), t.card('customFieldItems')]).then(function (res) {
          var defs = res[0].customFields || [], items = res[1].customFieldItems || [], byId = {}, byName = {}, out = {};
          defs.forEach(function (d) { byId[d.id] = d; });
          items.forEach(function (it) {
            var d = byId[it.idCustomField]; if (!d) return;
            var v = null;
            if (d.type === 'list') {
              var o = (d.options || []).filter(function (x) { return x.id === it.idValue; })[0];
              v = o ? o.value.text : null;
            } else if (it.value) {
              v = it.value.date || it.value.text || it.value.number || null;
            }
            if (v !== null) byName[d.name] = String(v);
          });
          Object.keys(FIELDS).forEach(function (k) { var cf = FIELDS[k].cf; if (cf && byName[cf]) out[k] = byName[cf]; });
          return out;
        }).catch(function () { return {}; });
      }

      function load() {
        if (editing) return t.sizeTo('#content');
        return t.get('card', 'shared', 'job').then(function (stored) {
          if (stored) { job = stored; return draw(); }
          return fromCustomFields().then(function (old) {
            job = old;
            var p = Object.keys(old).length ? t.set('card', 'shared', 'job', old).catch(function () {}) : Promise.resolve();
            return p.then(draw);
          });
        });
      }

      t.render(load);
    </script>
  </body>
</html>
