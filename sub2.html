<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<style>
:root { --ink:#172b4d; --muted:#5e6c84; --line:#ebecf0; --needed:#a14b00; --link:#0c66e4; }
* { box-sizing: border-box; }
body { margin:0; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink); background:transparent; }
#content { padding:2px 2px 10px; }
h3 { font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:14px 0 8px; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.box { background:#f4f3f1; border-radius:8px; padding:10px 12px; min-width:0; }
.box.full { grid-column:1 / -1; }
.box .bl { font-size:13px; color:var(--muted); margin-bottom:3px; }
.box .bv { font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace; font-size:16px; font-weight:600; overflow-wrap:anywhere; }
.box .bv .need, .box .bv .empty, .box .bv a, .box .bv .txt { font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
.box .bv .empty { font-weight:400; }
.box .bv .txt { font-size:14px; font-weight:400; white-space:pre-wrap; }
.need { color:var(--needed); font-weight:600; }
.empty { color:var(--muted); }
a { color:var(--link); font-weight:600; text-decoration:none; }
.files { display:flex; flex-direction:column; gap:4px; }
.thumbs { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.thumbs img { width:72px; height:72px; object-fit:cover; border-radius:6px; }
.hint { font-size:12px; color:var(--muted); margin-top:6px; }
.bar { display:flex; justify-content:flex-end; gap:8px; margin-top:12px; }
button { font:inherit; font-size:14px; font-weight:600; border:0; border-radius:4px; padding:6px 12px; cursor:pointer; background:#e9ebee; color:var(--ink); }
button.primary { background:#0c66e4; color:#fff; }
input, textarea { font:inherit; font-size:14px; width:100%; padding:5px 8px; border:1px solid #c1c7d0; border-radius:4px; background:#fff; color:var(--ink); }
textarea { min-height:70px; resize:vertical; }
.sec { border-top:1px solid var(--line); margin-top:12px; padding-top:10px; }
.sh { font-size:13px; font-weight:700; margin-bottom:6px; }
.row { display:grid; grid-template-columns:150px 1fr; padding:4px 0; font-size:14px; align-items:center; }
.row .l { color:var(--muted); }
@media (max-width:420px) { .grid { grid-template-columns:1fr; } .row { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div id="content"></div>
<script>
var t = TrelloPowerUp.iframe();

// Which subcontractor board this card is on. Only what that sub may see is ever stored here:
// no job cost, payout or portal links.
var BOARDS = { '6ad83ff1e54e7e573993c604': 'Karen', '6ade9cecb1c486ba4e6e84cb': 'Alyssa' };
// Trello usernames that may edit every field. Everyone else can only add notes.
var OFFICE = ['jaketylerdurham'];

var FIELDS = {
scope: { label: 'Your Scope', type: 'text' },
navLink: { label: 'Navigate AI Link', type: 'text' },
navCode: { label: 'Navigate Access Code', type: 'text' },
lockbox: { label: 'Mechanical Lockbox', type: 'text' },
igloo: { label: 'Igloo Code', type: 'text' },
ecd: { label: 'ECD', type: 'date' },
paint: { label: 'Paint Label', type: 'text' },
flooring: { label: 'Flooring', type: 'text' },
coNotes: { label: 'Change Order Notes', type: 'notes' },
notes: { label: 'Notes', type: 'notes' }
};
var LAYOUT = {
Karen: {
view: [
{ title: 'Your scope', keys: ['scope', 'navLink', 'navCode', 'ecd'] },
{ title: 'Home access', keys: ['lockbox', 'igloo'] },
{ title: 'Paint and flooring', keys: ['paint', 'flooring'] },
{ title: 'Change orders', keys: ['coNotes'], photos: 1 },
{ title: 'Notes for Karen and Twisted Turns', keys: ['notes'] }
],
office: ['scope', 'navLink', 'navCode', 'ecd', 'lockbox', 'igloo', 'paint', 'flooring'],
open: ['coNotes', 'notes']
},
Alyssa: {
view: [
{ title: 'Your scope', keys: ['scope', 'ecd'], pdfs: 1 },
{ title: 'Home access', keys: ['lockbox', 'igloo'] },
{ title: 'Paint', keys: ['paint'] },
{ title: 'Notes', keys: ['notes'] }
],
office: ['scope', 'ecd', 'lockbox', 'igloo', 'paint'],
open: ['notes']
}
};
var FULL = { scope: 1, navLink: 1, coNotes: 1, notes: 1, flooring: 1 };

var who = '', job = {}, files = [], office = false, editing = false;

function esc(s) {
return String(s).replace(/[&<>"']/g, function (c) {
return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
});
}
function md(d) { var x = new Date(d); return isNaN(x) ? '' : ('0' + (x.getUTCMonth() + 1)).slice(-2) + '/' + ('0' + x.getUTCDate()).slice(-2) + '/' + x.getUTCFullYear(); }
function iso(d) { return new Date(d).toISOString().slice(0, 10); }
function isPdf(a) { return /\.pdf($|\?)/i.test(a.name || '') || /\.pdf($|\?)/i.test(a.url || '') || a.mimeType === 'application/pdf'; }
function isCo(a) { return /^(co\b|change order)/i.test(a.name || ''); }

function shown(key) {
var f = FIELDS[key], v = job[key];
if (v === undefined || v === null || v === '') return '<span class="empty">Not provided</span>';
if (/^needed$/i.test(String(v))) return '<span class="need">Needed</span>';
if (f.type === 'date') return md(v);
if (f.type === 'notes') return '<span class="txt">' + esc(v) + '</span>';
if (/^https?:\/\//i.test(String(v))) {
var name = { navLink: 'Open Navigate AI', scope: 'Open your scope' }[key] || 'Open';
return '<a href="' + esc(v) + '" target="_blank" rel="noopener">' + name + ' ↗</a>';
}
return esc(v);
}

function link(a) { return '<a href="' + esc(a.url) + '" target="_blank" rel="noopener">' + esc(a.name || 'File') + ' ↗</a>'; }

function viewHtml() {
var html = '<div class="bar" style="margin-top:0;margin-bottom:8px"><button class="primary" id="edit">' + (office ? 'Edit card' : 'Add notes') + '</button></div>';
LAYOUT[who].view.forEach(function (s) {
html += '<h3>' + s.title + '</h3><div class="grid">';
s.keys.forEach(function (k) {
html += '<div class="box' + (FULL[k] ? ' full' : '') + '"><div class="bl">' + FIELDS[k].label + '</div><div class="bv">' + shown(k) + '</div></div>';
});
if (s.pdfs) {
var pdfs = files.filter(isPdf);
html += '<div class="box full"><div class="bl">Scope PDF</div><div class="bv files">' +
(pdfs.length ? pdfs.map(link).join('') : '<span class="empty">Not attached yet</span>') + '</div></div>';
}
if (s.photos) {
var co = files.filter(isCo);
html += '<div class="box full"><div class="bl">Change Order Photos</div><div class="bv">' +
(co.length ? '<div class="thumbs">' + co.map(function (a) {
var p = (a.previews || []).filter(function (x) { return x.width >= 100; })[0];
return '<a href="' + esc(a.url) + '" target="_blank" rel="noopener">' + (p ? '<img src="' + esc(p.url) + '" alt="">' : esc(a.name)) + '</a>';
}).join('') + '</div>' : '<span class="empty">No photos yet</span>') +
'<div class="hint">Add photos with the card\'s Attachment button and start the name with "CO", like "CO - kitchen cabinet".</div></div></div>';
}
html += '</div>';
});
return html;
}

function input(key) {
var f = FIELDS[key], v = job[key] || '';
if (f.type === 'date') return '<input type="date" data-k="' + key + '" value="' + (v ? iso(v) : '') + '">';
if (f.type === 'notes') return '<textarea data-k="' + key + '">' + esc(v) + '</textarea>';
return '<input type="text" data-k="' + key + '" value="' + esc(v) + '">';
}

function editHtml() {
var L = LAYOUT[who], keys = (office ? L.office : []).concat(L.open), html = '<div class="sec">';
keys.forEach(function (k) { html += '<div class="row"><span class="l">' + FIELDS[k].label + '</span>' + input(k) + '</div>'; });
html += '</div><div class="bar"><button id="cancel">Cancel</button><button class="primary" id="save">Save</button></div>';
return html;
}

function draw() {
var el = document.getElementById('content');
if (!who) { el.innerHTML = ''; return t.sizeTo('#content'); }
el.innerHTML = editing ? editHtml() : viewHtml();
if (editing) {
document.getElementById('cancel').onclick = function () { editing = false; draw(); };
document.getElementById('save').onclick = save;
} else {
document.getElementById('edit').onclick = function () { editing = true; draw(); };
}
return t.sizeTo('#content');
}

function save() {
// Fields this person can't edit keep their saved values.
var next = {};
Object.keys(job).forEach(function (k) { next[k] = job[k]; });
Array.prototype.forEach.call(document.querySelectorAll('[data-k]'), function (el) {
var k = el.getAttribute('data-k'), v = el.value.trim();
if (!v) { delete next[k]; return; }
next[k] = FIELDS[k].type === 'date' ? v + 'T12:00:00.000Z' : v;
});
return t.set('card', 'shared', 'sub', next).then(function () { job = next; editing = false; return draw(); });
}

// Cards n8n makes write "Label: value" lines in the description; those fill anything never saved.
// A payout or cost line is never read.
function fromDescription(desc) {
var d = (desc || '').replace(/\\n/g, '\n').replace(/\*\*/g, ''), out = {};
function line(label) { var m = d.match(new RegExp('^' + label + ':[ \\t]*(.+)$', 'mi')); return m ? m[1].trim() : ''; }
function clean(v) { return /^(not provided|add once available)/i.test(v) ? '' : v; }
function url(v) { var m = v.match(/(https?:\/\/[^\s|)"]+)/); return m ? m[1] : ''; }
function date(v) { var m = v.match(/^(\d{2})\/(\d{2})\/(\d{4})/); return m ? m[3] + '-' + m[1] + '-' + m[2] + 'T12:00:00.000Z' : ''; }
var nav = url(line('Navigate AI') || line('Navigate Link') || line('Navigate')); if (nav) out.navLink = nav;
var mc = nav.match(/code=([A-Za-z0-9]+)/); if (mc) out.navCode = mc[1];
var nc = clean(line('Navigate Access Code') || line('Inspection Code')); if (nc) out.navCode = nc;
var lb = clean(line('Lockbox')); if (lb) out.lockbox = lb;
var ig = clean(line('Igloo Code') || line('Igloo')); if (ig) out.igloo = ig;
if (!lb && !ig) { var ac = clean(line('Access code')); if (ac) out.lockbox = ac; }
var e = date(line('ECD') || line('Est. completion')); if (e) out.ecd = e;
var sc = url(line('Scope') || line('Your Scope')); if (sc) out.scope = sc;
var p = clean(line('Paint Label')); if (p) out.paint = p;
var fl = clean(line('Flooring')); if (fl) out.flooring = fl;
return out;
}

function load() {
if (editing) return t.sizeTo('#content');
return Promise.all([t.board('id'), t.member('username'), t.get('card', 'shared', 'sub'), t.card('desc', 'attachments')]).then(function (r) {
who = BOARDS[r[0].id] || '';
office = OFFICE.indexOf(r[1].username) >= 0;
var stored = r[2] || {}, c = r[3] || {}, from = fromDescription(c.desc);
job = {};
Object.keys(from).forEach(function (k) { job[k] = from[k]; });
Object.keys(stored).forEach(function (k) { job[k] = stored[k]; });
files = c.attachments || [];
return draw();
});
}

t.render(load);
</script>
</body>
</html>
