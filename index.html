<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Twisted Turns Job Card</title>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script src="./migrate.js"></script>
</head>
<body>
<script>
var ICON = 'https://cdn.jsdelivr.net/npm/@tabler/icons@2.47.0/icons/clipboard-list.svg';
var JOBS_BOARD = '6ad4177cbae2e4f1006a4efc';
var SUB_BOARDS = { '6ad83ff1e54e7e573993c604': 'Karen', '6ade9cecb1c486ba4e6e84cb': 'Alyssa' };
var SCOPING_ACCESS = '6ad41787807d5a5ea54c351f';
var IN_PROGRESS = '6ad4178d04d73fb79ebe8a2c';
// Practice cards that show the new layout before it goes to every card.
var PRACTICE = ['6ad4d6fb96a94b01bea4d0ee', '6ad8f430200da064556b9454', '6ad8f410befe8a03c4226cc2'];

function md(d) {
var x = new Date(d);
return (x.getUTCMonth() + 1 < 10 ? '0' : '') + (x.getUTCMonth() + 1) + '/' + (x.getUTCDate() < 10 ? '0' : '') + x.getUTCDate();
}
// Reads "Label: MM/DD/YYYY" from the card description.
function descDate(desc, label) {
var m = (desc || '').replace(/\*\*/g, '').match(new RegExp('^' + label + ':[ \\t]*(\\d{2})\\/(\\d{2})\\/(\\d{4})', 'mi'));
return m ? m[3] + '-' + m[1] + '-' + m[2] + 'T12:00:00.000Z' : '';
}
// A date written to the description since the Job Card was last saved wins over the saved one.
function pick(job, seen, desc, key, label) {
var d = descDate(desc, label);
if (d && (!job[key] || d !== seen[key])) return d;
return job[key] || '';
}

TrelloPowerUp.initialize({
'card-back-section': function (t) {
return Promise.all([t.board('id'), t.card('id')]).then(function (r) {
var board = r[0].id, card = r[1].id;
if (SUB_BOARDS[board]) {
return { title: SUB_BOARDS[board] + '’s Job', icon: ICON, content: { type: 'iframe', url: t.signUrl('./sub2.html'), height: 480 } };
}
var page = PRACTICE.indexOf(card) >= 0 ? './section6.html' : './section2.html';
return { title: 'Job Card', icon: ICON, content: { type: 'iframe', url: t.signUrl(page), height: 480 } };
});
},
// One date on the front of the card: the scheduled scope in Scoping & Access, the ECD in In progress.
'card-badges': function (t) {
return Promise.all([t.getAll(), t.card('id', 'name', 'idList', 'desc'), t.board('id')]).then(function (r) {
if (r[2].id !== JOBS_BOARD) return [];
var sh = (r[0] && r[0].card && r[0].card.shared) || {}, c = r[1] || {};
var job = sh.job || {}, seen = sh.descSeen || {};
if (MIGRATE.indexOf(c.id) >= 0 && !sh.migrated && (c.desc || '').trim()) {
var from = descToJob(c.name, c.desc), next = {};
Object.keys(from).forEach(function (k) { next[k] = from[k]; });
// Anything already typed into the Job Card stays as it is.
Object.keys(job).forEach(function (k) { next[k] = job[k]; });
job = next;
t.set('card', 'shared', { job: next, migrated: 1 });
}
if (c.idList === SCOPING_ACCESS) {
var s = pick(job, seen, c.desc, 'scopeDate', 'Scheduled Scope');
return [{ text: s ? 'Scope ' + md(s) : 'Scope date needed', color: s ? 'orange' : 'red' }];
}
if (c.idList === IN_PROGRESS) {
var e = pick(job, seen, c.desc, 'ecd', 'ECD');
return [{ text: e ? 'ECD ' + md(e) : 'ECD needed', color: e ? 'green' : 'red' }];
}
return [];
});
}
});
</script>
</body>
</html>
