<!doctype html>
<html>
  <head>
      <meta charset="utf-8">
      <title>Twisted Turns Job Card</title>
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
  </head>
<body>
  <script>
      var ICON = 'https://cdn.jsdelivr.net/npm/@tabler/icons@2.47.0/icons/clipboard-list.svg';

      function md(d) {
            var x = new Date(d);
            return (x.getUTCMonth() + 1 < 10 ? '0' : '') + (x.getUTCMonth() + 1) + '/' + (x.getUTCDate() < 10 ? '0' : '') + x.getUTCDate();
      }

      TrelloPowerUp.initialize({
            'card-back-section': function (t) {
                    return {
                              title: 'Job Card',
                              icon: ICON,
                              content: { type: 'iframe', url: t.signUrl('./section.html'), height: 480 }
                    };
            },
            // Small tags on the front of the card.
            'card-badges': function (t) {
                    return t.get('card', 'shared', 'job').then(function (job) {
                              job = job || {};
                              var out = [];
                              if (job.scopeDate) out.push({ text: 'Scope ' + md(job.scopeDate), color: 'orange' });
                              if (job.sub) out.push({ text: 'Sub: ' + job.sub, color: 'blue' });
                              if (job.ecd) out.push({ text: 'ECD ' + md(job.ecd), color: 'green' });
                              if (!job.accessPdf || /^needed$/i.test(job.accessPdf)) out.push({ text: 'Access PDF needed', color: 'red' });
                              return out;
                    });
            }
      });
  </script>
</body>
