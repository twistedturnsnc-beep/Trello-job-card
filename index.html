<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Twisted Turns Job Card</title>
<script src="https://p.trellocdn.com/power-up.min.js"></script>
<script src="./migrate.js"></script>
</head>
<body>
<script>
var ICON = 'https://cdn.jsdelivr.net/npm/@tabler/icons@2.47.0/icons/clipboard-list.svg';
var JOBS_BOARD = '6ad4177cbae2e4f1006a4efc';
var SUB_BOARDS = { '6ad83ff1e54e7e573993c604': 'Karen', '6ade9cecb1c486ba4e6e84cb': 'Alyssa' };
var IN_PROGRESS = '6ad4178d04d73fb79ebe8a2c';
// The Job Card's own Trello key. Candice clicks Allow once on a Job Card so it can empty descriptions (Candice, 10/31).
var APP_KEY = 'ad3efcf32217b49cb05c06e7399eb447';

function md(d) {
var x = new Date(d);
return (x.getUTCMonth() + 1 < 10 ? '0' : '') + (x.getUTCMonth() + 1) + '/' + (x.getUTCDate() < 10 ? '0' : '') + x.getUTCDate();
}
// Reads "Label: MM/DD/YYYY" from the card description.
function descDate(desc, label) {
var m = (desc || '').replace(/\*\*/g, '').match(new RegExp('^' + label + ':[ \\t]*(\\d{2})\\/(\\d{2})\\/(\\d{4})', 'mi'));
return m ? m[3] + '-' + m[1] + '-' + m[2] + 'T12:00:00.000Z' : '';
}
// A date written to the description since the Job Card was last saved wins over the saved one.
function pick(job, seen, desc, key, label) {
var d = descDate(desc, label);
if (d && (!job[key] || d !== seen[key])) return d;
return job[key] || '';
}

// A short fingerprint of a description. n8n computes the same one to know the description is saved in the Job Card and can be cleared.
function descHash(s) {
s = String(s || '');
var h = 5381;
for (var i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
return h.toString(16);
}
// Empties the description once its text is saved in the Job Card. Skipped if the description changed in the meantime.
// Without the one-time Allow, nothing happens here and n8n's cleanup empties it instead.
function clearDesc(t, id, hash) {
var api = t.getRestApi();
return api.isAuthorized().then(function (ok) {
if (!ok) return;
return api.getToken().then(function (token) {
var url = 'https://api.trello.com/1/cards/' + id + '?key=' + APP_KEY + '&token=' + token;
return fetch(url + '&fields=desc').then(function (r) { return r.json(); }).then(function (cur) {
if (!(cur.desc || '').trim() || descHash(cur.desc) !== hash) return;
return fetch(url, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ desc: '' }) });
});
});
});
}
// Copies what n8n or a person wrote in the description into the Job Card, so the description can be emptied (Candice, 10/30).
// Values typed into the Job Card are kept unless the description has a newer value; notes are added, never replaced.
function absorb(job, seen, name, desc) {
var from = descToJob(name, desc), d = (desc || '').replace(/\*\*/g, '');
function line(label) { var m = d.match(new RegExp('^' + label + ':[ \\t]*(.+)$', 'mi')); return m ? m[1].trim() : ''; }
function link(v) { var m = v.match(/(https?:\/\/[^\s|)"\]]+)/); return m ? m[1] : ''; }
var portal = link(line('Portal Link') || line('Portal')); if (portal) from.portal = portal;
var paint = line('Paint Label'); if (paint && !/^(not provided|needed)/i.test(paint)) from.paint = paint;
var insp = descDate(desc, 'Scope Inspection'), iso = line('Navigate AI Inspection').match(/^(\d{4}-\d{2}-\d{2})/);
if (insp) from.inspection = insp; else if (iso) from.inspection = iso[1] + 'T12:00:00.000Z';
if (from.notes) from.notes = from.notes.split('\n').filter(function (l) { return !/^(Portal Link|Portal|Paint Label|Navigate AI Inspection|Scope Inspection):/i.test(l); }).join('\n');
var next = {}, nextSeen = {};
Object.keys(job).forEach(function (k) { next[k] = job[k]; });
Object.keys(seen).forEach(function (k) { nextSeen[k] = seen[k]; });
Object.keys(from).forEach(function (k) {
var v = from[k];
if (!v) return;
if (k === 'notes' || k === 'otherWo') {
var sep = k === 'notes' ? '\n' : '; ', have = next[k] ? String(next[k]).split(sep) : [];
String(v).split(sep).forEach(function (x) { if (x && have.indexOf(x) < 0) have.push(x); });
next[k] = have.join(sep);
} else if (!(k in next) || v !== seen[k]) next[k] = v;
nextSeen[k] = v;
});
return { job: next, seen: nextSeen };
}

TrelloPowerUp.initialize({
'card-back-section': function (t) {
return t.board('id').then(function (b) {
var board = b.id;
if (SUB_BOARDS[board]) {
return { title: SUB_BOARDS[board] + '’s Job', icon: ICON, content: { type: 'iframe', url: t.signUrl('./sub2.html'), height: 480 } };
}
return { title: 'Job Card', icon: ICON, content: { type: 'iframe', url: t.signUrl('./section7.html'), height: 480 } };
});
},
// The ECD on the front of In progress cards. Scoping cards show Trello's own due date instead.
'card-badges': function (t) {
return Promise.all([t.getAll(), t.card('id', 'name', 'idList', 'desc'), t.board('id')]).then(function (r) {
if (r[2].id !== JOBS_BOARD) return [];
var sh = (r[0] && r[0].card && r[0].card.shared) || {}, c = r[1] || {};
var job = sh.job || {}, seen = sh.descSeen || {};
if (MIGRATE.indexOf(c.id) >= 0 && !sh.migrated && (c.desc || '').trim()) {
var from = descToJob(c.name, c.desc), next = {};
Object.keys(from).forEach(function (k) { next[k] = from[k]; });
// Anything already typed into the Job Card stays as it is.
Object.keys(job).forEach(function (k) { next[k] = job[k]; });
job = next;
t.set('card', 'shared', { job: next, migrated: 1 });
}
// Save any description text into the Job Card the first time the board shows it; n8n then empties the description.
if ((c.desc || '').trim() && sh.descHash !== descHash(c.desc)) {
var a = absorb(job, seen, c.name, c.desc);
job = a.job; seen = a.seen;
var hash = descHash(c.desc);
t.set('card', 'shared', { job: job, descSeen: seen, descHash: hash }).then(function () { return clearDesc(t, c.id, hash); }).catch(function () {});
}
if (c.idList === IN_PROGRESS) {
var e = pick(job, seen, c.desc, 'ecd', 'ECD');
return [{ text: e ? 'ECD ' + md(e) : 'ECD needed', color: e ? 'green' : 'red' }];
}
return [];
});
}
}, { appKey: APP_KEY, appName: 'Twisted Turns Job Card' });
</script>
</body>
</html>
